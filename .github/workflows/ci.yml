name: CI
on: [push, pull_request]
jobs:
  lint-nix-and-lua:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load Nix Configuration
        uses: rrbutani/use-nix-shell-action@v1
      - name: Lint nix
        run: statix check
      - name: Find nix dead code
        run: deadnix -f
      - name: Check Lua files
        uses: nebularg/actions-luacheck@v1
        with:
          files: ./home/modules/neovim/files
  build-packages:
    runs-on: ${{ matrix.os_version }}
    strategy:
      matrix:
        os_version: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v30
      - name: Install Cachix
        uses: cachix/cachix-action@v15
        with:
          name: surface-zen
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix flake show
      - name: Build Common Packages
        run: |
          for pkg in lombok jdtls codeium-ls vscode-js-debug bash-language-server tanzu tridentctl; do
            nix build ".#${pkg}"
            cachix push surface-zen result
          done
      - name: Build Linux Packages
        run: |
          for pkg in onedriver spotube tana; do
            nix build ".#${pkg}"
            cachix push surface-zen result
          done
        if: ${{ matrix.os_version == 'ubuntu-latest' }}
